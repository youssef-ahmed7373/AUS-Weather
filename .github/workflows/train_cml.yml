####################################################

name: dvc-pipeline

on:
  pull_request:
    branches: [train-model-setup]

permissions: write-all

jobs:
  train_and_report_eval_performance:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout 
        uses: actions/checkout@v3
        with:
          fetch-depth: 0 # Important for comparing branches

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'

      - name: Setup CML
        uses: iterative/setup-cml@v2
          
      - name: Setup DVC
        uses: iterative/setup-dvc@v1
      
      # 1. Install GDrive support (The DVC action doesn't include it by default)
      - name: Install GDrive support
        run: pip install "dvc[gdrive]"

      # 2. Configure and Pull data from Google Drive
      - name: Pull data from GDrive
        env:
          GDRIVE_CREDENTIALS_DATA: ${{ secrets.GDRIVE_CREDENTIALS_DATA }}
        run: |
          # 1. Force DVC to use OAuth instead of Service Account
          dvc remote modify myremote --local gdrive_use_service_account false
          # Use --local to keep these settings only in the GitHub Runner environment
          dvc remote modify myremote --local gdrive_client_id ${{ secrets.GDRIVE_CLIENT_ID }}
          dvc remote modify myremote --local gdrive_client_secret ${{ secrets.GDRIVE_CLIENT_SECRET }}
          dvc pull
      - name: install Needed Libraries for training model
        run: |
          pip install pandas scikit-learn matplotlib
#           python3 preprocess_dataset.py
#           python3 train.py

      # 3. Run the training pipeline
      - name: Run DVC pipeline
        run: dvc repro

      # 4. Generate CML Report
      - name: Write CML report
        env:
          REPO_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Ensure we have the main branch available for comparison
          git fetch origin train-model-setup:train-model-setup 
          
          echo "## 📊 Rainfall Model Performance Report" > report.md
          echo "### Metrics Comparison (vs Main)" >> report.md
          dvc metrics diff train-model-setup --md >> report.md
          
          echo "### Pipeline Status" >> report.md
          echo "Model training completed successfully on GitHub Actions runner." >> report.md
          
          # This creates the actual comment on your Pull Request
          cml comment create report.md

 
















